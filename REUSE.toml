version = 1

# Copyright (C) 2024 Johannes Endres
#
# SPDX-License-Identifier: MIT

SPDX-PackageName = "*cloud - *cloud - FileLink for Nextcloud OpenCloud ownCloud"
SPDX-PackageSupplier = "Johannes Endres <je@johannes-endres.de>"
SPDX-PackageDownloadLocation = "https://gitlab.com/joendres/filelink-nextcloud"

[[annotations]]
path = "src/icons/nextcloud-logo.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "Nextcloud GmbH"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = "src/icons/owncloud-logo.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "ownCloud GmbH"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = "src/icons/ocis-app-icon.png"
precedence = "aggregate"
SPDX-FileCopyrightText = "ownCloud GmbH"
SPDX-License-Identifier = "AGPL-3.0-only"
SPDX-FileComment = "Source: https://github.com/owncloud/web/tree/master/packages/web-runtime/themes/owncloud/assets"

[[annotations]]
path = "src/icons/opencloud-logo.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "OpenCloud GmbH"
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileComment = "https://github.com/opencloud-eu/opencloud/blob/main/services/web/assets/themes/opencloud/assets/favicon.svg"

[[annotations]]
path = [
    "src/photon-components-web/**",
    "src/management/images/Check.svg",
    "src/management/images/Close.svg",
    "src/management/images/Help.svg",
    "src/management/images/Warning.svg",
    "src/compose_action/Copy.svg",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2018 The Firefox UX Team"
SPDX-License-Identifier = "MPL-2.0"
SPDX-FileComment = "*cloud uses the distribution version of photon-components-web that doesn't include copyright and license. So I guessed that information from https://github.com/FirefoxUX/photon-components-web"

# Generated files
[[annotations]]
path = "package-lock.json"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["tests/responses/capabilities/*.json"]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MIT"

# Make REUSE API happy
# This should be in the file as 
# "//": [
#     "Copyright (C) 2024 Johannes Endres",
#     "SPDX-License-Identifier: MIT"
#   ],
[[annotations]]
path = "package.json"
SPDX-FileCopyrightText = "2024 Johannes Endres"
SPDX-License-Identifier = "MIT"
